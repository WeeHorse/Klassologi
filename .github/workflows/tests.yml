# Kör alla automatiska tester vid varje pull request mot main.
# Samma tester och kommandon som lokalt, se README.md och Specifications/Technology.md (Test).
name: Tester

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (xUnit + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Bygg (varningar som fel)
        run: dotnet build Klassologi.slnx
      - name: Testa
        run: dotnet test --solution Klassologi.slnx --no-build

  frontend:
    name: Frontend (lint, typer, bygge, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typkontroll och bygge
        run: npm run build
      - name: Vitest
        run: npm test

  e2e:
    name: Hela kedjan (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Engångslösenord för den här körningen. Inga hemligheter i repot eller i GitHub behövs.
      - name: Starta databasen
        run: |
          root_password=$(openssl rand -hex 16)
          password=$(openssl rand -hex 16)
          echo "::add-mask::$root_password"
          echo "::add-mask::$password"
          sed -e "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$root_password/" \
              -e "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=$password/" .env.example > .env
          docker compose up -d --wait
          echo "ConnectionStrings__Klassologi=Server=127.0.0.1;Port=3306;Database=klassologi;User ID=klassologi;Password=$password;SslMode=Required" >> "$GITHUB_ENV"

      - name: Installera beroenden och webbläsare
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: web
        run: npm run e2e

      - name: Spara Playwright-rapporten vid fel
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
